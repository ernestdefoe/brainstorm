ernestdefoe-gauntlet:
  # Messages the server sends back.
  api:
    title: Give the quiz a title of up to 200 characters.
    dates: The closing date has to come after the opening date.
    publish_empty: Add at least one question before publishing.
    too_many_questions: A quiz can have up to {max} questions.
    question_type: Question {number} has a type this forum does not know.
    question_body: Question {number} needs its question, up to 5,000 characters.
    option_length: An answer in question {number} is longer than 300 characters.
    option_count: Question {number} needs {min} to {max} answers.
    accepted_count: Question {number} needs {min} to {max} accepted answers.
    no_correct: Mark at least one correct answer in question {number}.
    image_url: The image for question {number} has to be a web address starting with http:// or https://.
    no_attempts_left: You have used all your attempts at this quiz.
    no_questions: This quiz has no questions yet.
    slow_down: That is a lot in a short time. Give it a few minutes and try again.

  admin:
    permissions:
      view: View quizzes
      take: Take quizzes
      create: Write quizzes
      manage: Edit and delete any quiz, see every result
      reward: Attach points and badges to quizzes
    settings:
      show_nav: Show "Quizzes" in the sidebar navigation
    badges:
      quizzes_passed: Quizzes passed (Gauntlet)
      perfect_scores: Quizzes finished with 100% (Gauntlet)

# Gauntlet's step for Onramp, the onboarding checklist.
ernestdefoe-onramp:
  lib:
    types:
      gauntlet:
        passed:
          title: "{count, plural, one {Pass a quiz} other {Pass # quizzes}}"
          description: Test what you know in one of the forum's quizzes.
          button: Find a quiz
  admin:
    types:
      gauntlet:
        passed: Pass quizzes (Gauntlet)
